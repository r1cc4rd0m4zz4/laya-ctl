[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-ctl"
version = "0.1.0"
description = "Zero-dependency background service controller for upstream laya-serve (Linux & macOS)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Riccardo Mazza" }]
keywords = ["laya", "controller", "daemon", "cli", "ai-inference", "macos", "linux"]
dependencies = []

[project.scripts]
laya-ctl = "laya_ctl:main"

[tool.setuptools]
py-modules = ["laya_ctl"]
